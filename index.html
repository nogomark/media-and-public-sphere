<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>미디어와 공론장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #2a1f14;
  --paper: #faf7f0;
  --paper-shadow: #e8e0d0;
  --ink: #1a1612;
  --ink-light: #5a4e42;
  --accent: #8b4513;
  --accent-light: #c4956a;
  --rule: #d4c4a8;
  --sky: #2c4a6e;
  --claude-bg: #eef3f8;
  --sky-bg: #fdf6ee;
  --spine: #6b3a1f;
  --font-serif: 'Noto Serif KR', Georgia, serif;
  --font-sans: 'Noto Sans KR', sans-serif;
}

html, body {
  height: 100%; overflow: hidden;
  background: var(--bg);
  font-family: var(--font-serif);
}

body {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

/* ── DARK MODE ── */
.dark { --bg: #0d0a07; --paper: #1e1a14; --paper-shadow: #151209; --ink: #e8ddd0; --ink-light: #9a8878; --accent: #c4956a; --accent-light: #a07050; --rule: #3a322a; --spine: #3a1f0a; --claude-bg: #1c2228; --sky-bg: #1a160e; }

/* ── OUTER SHELL ── */
.shell {
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  perspective: 2000px;
}

/* ── TOP BAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  background: rgba(42,31,20,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(196,149,106,0.2);
}
.topbar-title {
  font-family: var(--font-serif); font-size: 13px; font-weight: 600;
  color: #c4956a; letter-spacing: 0.08em;
}
.topbar-controls { display: flex; gap: 14px; align-items: center; }
.btn-icon {
  background: none; border: none; cursor: pointer;
  color: #a07050; font-size: 15px; padding: 4px 6px;
  border-radius: 3px; transition: color 0.2s; line-height: 1;
}
.btn-icon:hover { color: #c4956a; }

/* ── BOOK STAGE ── */
.book-stage {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  padding-top: 44px;
}

/* ── BOOK ── */
.book {
  position: relative;
  display: flex;
  width: min(90vw, 900px);
  height: min(80vh, 600px);
  transform-style: preserve-3d;
  filter: drop-shadow(0 20px 60px rgba(0,0,0,0.6));
}

/* ── SPINE ── */
.spine {
  width: 28px; flex-shrink: 0;
  background: linear-gradient(to right, #3a1f0a, #6b3a1f, #4a2510);
  border-radius: 2px 0 0 2px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  z-index: 10;
  box-shadow: inset -3px 0 8px rgba(0,0,0,0.4), 2px 0 6px rgba(0,0,0,0.3);
}
.spine-text {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  transform: rotate(0deg);
  font-family: var(--font-serif);
  font-size: 9px; font-weight: 600;
  color: #c4956a; letter-spacing: 0.15em;
  opacity: 0.8;
}

/* ── PAGE CONTAINER ── */
.pages-wrap {
  flex: 1; position: relative;
  transform-style: preserve-3d;
  overflow: hidden;
  border-radius: 0 3px 3px 0;
}

/* ── SINGLE PAGE (mobile / current) ── */
.page-single {
  position: absolute; inset: 0;
  background: var(--paper);
  overflow-y: auto;
  padding: 32px 28px 24px;
  scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
  border-left: 1px solid var(--rule);
}
.page-single::-webkit-scrollbar { width: 3px; }
.page-single::-webkit-scrollbar-thumb { background: var(--rule); }

/* ── TWO-PAGE SPREAD (desktop) ── */
.spread {
  display: none;
  position: absolute; inset: 0;
  transform-style: preserve-3d;
}

/* ── FLIP ANIMATION ── */
.page-flip-container {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
}

.page-left, .page-right {
  position: absolute; top: 0; bottom: 0;
  width: 50%;
  background: var(--paper);
  overflow: hidden;
}
.page-left { left: 0; border-right: 1px solid var(--rule); }
.page-right { right: 0; }

.page-left .page-inner,
.page-right .page-inner {
  height: 100%; overflow-y: auto;
  padding: 28px 24px 20px;
  scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
}
.page-left .page-inner::-webkit-scrollbar,
.page-right .page-inner::-webkit-scrollbar { width: 3px; }
.page-left .page-inner::-webkit-scrollbar-thumb,
.page-right .page-inner::-webkit-scrollbar-thumb { background: var(--rule); }

/* page number */
.pg-num {
  text-align: center;
  font-family: var(--font-sans); font-size: 10px;
  color: var(--ink-light); font-weight: 300;
  padding: 6px 0 0;
  border-top: 1px solid var(--rule);
  margin-top: 12px;
}

/* ── FLIP EFFECT ── */
.flip-panel {
  position: absolute; top: 0; bottom: 0; right: 0;
  width: 50%;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1.000);
  pointer-events: none;
  z-index: 20;
}
.flip-panel.flipping-forward { animation: flipForward 0.6s cubic-bezier(0.645,0.045,0.355,1.000) forwards; }
.flip-panel.flipping-back    { animation: flipBack    0.6s cubic-bezier(0.645,0.045,0.355,1.000) forwards; }

@keyframes flipForward {
  0%   { transform: rotateY(0deg);    }
  100% { transform: rotateY(-180deg); }
}
@keyframes flipBack {
  0%   { transform: rotateY(-180deg); }
  100% { transform: rotateY(0deg);    }
}

.flip-front, .flip-back {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--paper);
  overflow: hidden;
  padding: 28px 24px 20px;
  box-shadow: inset -4px 0 12px rgba(0,0,0,0.08);
}
.flip-back { transform: rotateY(180deg); }

/* center crease shadow */
.crease {
  position: absolute; top: 0; bottom: 0;
  left: 50%; width: 4px;
  background: linear-gradient(to right, rgba(0,0,0,0.12), rgba(0,0,0,0.04), rgba(0,0,0,0.12));
  transform: translateX(-50%);
  z-index: 5; pointer-events: none;
}

/* ── BOTTOM NAV ── */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px 12px;
  background: rgba(42,31,20,0.92);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(196,149,106,0.2);
}
.nav-btn {
  background: none; border: 1px solid rgba(196,149,106,0.3); cursor: pointer;
  font-family: var(--font-sans); font-size: 12px; color: #a07050;
  padding: 5px 16px; border-radius: 2px; transition: all 0.2s;
}
.nav-btn:hover { color: #c4956a; border-color: #c4956a; }
.nav-btn:disabled { opacity: 0.25; cursor: default; }
.nav-btn:disabled:hover { color: #a07050; border-color: rgba(196,149,106,0.3); }
.page-indicator { font-family: var(--font-sans); font-size: 11px; color: #7a5a3a; font-weight: 300; }

/* ── TOC OVERLAY ── */
.toc-overlay {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.65); align-items: flex-start; justify-content: center; padding-top: 52px;
}
.toc-overlay.open { display: flex; }
.toc-panel {
  background: var(--paper); width: min(480px, 94vw);
  max-height: 70vh; overflow-y: auto;
  border-radius: 4px; padding: 24px 28px 28px;
  box-shadow: 0 16px 60px rgba(0,0,0,0.5);
}
.toc-hdr {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--rule);
}
.toc-hdr-title { font-family: var(--font-sans); font-size: 11px; font-weight: 300; letter-spacing: 0.25em; color: var(--ink-light); text-transform: uppercase; }
.toc-list { list-style: none; }
.toc-item { display: flex; align-items: baseline; padding: 10px 0; border-bottom: 1px dotted var(--rule); cursor: pointer; transition: color 0.2s; }
.toc-item:hover { color: var(--accent); }
.toc-num { font-family: var(--font-sans); font-size: 11px; color: var(--accent-light); min-width: 28px; font-weight: 300; }
.toc-name { font-size: 14px; font-weight: 400; flex: 1; }

/* ── CONTENT STYLES ── */
.cover { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; text-align: center; padding: 32px 20px; }
.cover-ornament { font-size: 28px; margin-bottom: 24px; opacity: 0.5; }
.cover-subtitle { font-family: var(--font-sans); font-size: 10px; font-weight: 300; letter-spacing: 0.3em; color: var(--ink-light); text-transform: uppercase; margin-bottom: 14px; }
.cover-title { font-size: clamp(22px, 4vw, 32px); font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; color: var(--ink); }
.cover-rule { width: 40px; height: 2px; background: var(--accent-light); margin: 18px auto; }
.cover-authors { font-family: var(--font-sans); font-size: 13px; color: var(--ink-light); line-height: 2; }
.cover-authors strong { color: var(--ink); font-weight: 500; }
.cover-desc { margin-top: 20px; font-size: 12px; font-weight: 300; color: var(--ink-light); line-height: 1.9; max-width: 240px; }
.cover-start { margin-top: 28px; padding: 10px 24px; border: 1px solid var(--accent-light); border-radius: 2px; background: none; font-family: var(--font-sans); font-size: 12px; color: var(--accent); cursor: pointer; letter-spacing: 0.1em; transition: all 0.2s; }
.cover-start:hover { background: var(--accent); color: white; border-color: var(--accent); }

.toc-content { padding: 8px 0; }
.toc-content .toc-title { font-size: 10px; font-weight: 300; letter-spacing: 0.25em; color: var(--ink-light); text-transform: uppercase; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }

.chap-header { margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.chap-num { font-family: var(--font-sans); font-size: 10px; font-weight: 300; letter-spacing: 0.2em; color: var(--accent-light); text-transform: uppercase; margin-bottom: 6px; }
.chap-title { font-size: clamp(15px, 3vw, 20px); font-weight: 700; line-height: 1.4; }

.dialogue { display: flex; flex-direction: column; }
.turn { display: flex; padding: 14px 0; border-bottom: 1px solid var(--rule); gap: 10px; }
.turn:last-child { border-bottom: none; }
.turn.sky-turn { background: var(--sky-bg); margin: 0 -24px; padding: 14px 24px; }
.turn.claude-turn { background: var(--claude-bg); margin: 0 -24px; padding: 14px 24px; }

.speaker-col { width: 52px; flex-shrink: 0; padding-top: 2px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.speaker-avatar { font-size: 16px; line-height: 1; }
.speaker-name { font-family: var(--font-sans); font-size: 9px; font-weight: 600; letter-spacing: 0.06em; line-height: 1.4; }
.speaker-name.sky { color: var(--sky); }
.speaker-name.claude { color: var(--accent); }
.speaker-note { font-family: var(--font-sans); font-size: 8px; font-weight: 300; color: var(--ink-light); }

.speech-col { flex: 1; }
.speech { font-size: 13px; font-weight: 300; line-height: 1.9; color: var(--ink); }
.speech p { margin-bottom: 10px; }
.speech p:last-child { margin-bottom: 0; }
.speech strong { font-weight: 600; }
.speech em { font-style: italic; color: var(--ink-light); }

.colophon { margin-top: 28px; padding-top: 20px; border-top: 2px solid var(--rule); text-align: center; }
.colophon-label { font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.2em; color: var(--ink-light); margin-bottom: 12px; text-transform: uppercase; }
.colophon-text { font-size: 12px; font-weight: 300; line-height: 2; color: var(--ink-light); max-width: 320px; margin: 0 auto; }
.colophon-ornament { margin-top: 20px; font-size: 18px; opacity: 0.4; }

/* ── FONT SIZE ── */
.font-sm .speech { font-size: 11px; }
.font-lg .speech { font-size: 15px; }

/* ── DESKTOP TWO-PAGE ── */
@media (min-width: 700px) {
  .page-single { display: none; }
  .spread { display: block; }
}
@media (max-width: 699px) {
  .book { width: 96vw; height: calc(100vh - 88px); }
  .spine { width: 16px; }
  .spine-text { font-size: 7px; }
}
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- TOP BAR -->
  <div class="topbar">
    <span class="topbar-title">미디어와 공론장</span>
    <div class="topbar-controls">
      <button class="btn-icon" id="btnFontDown">A−</button>
      <button class="btn-icon" id="btnFontUp">A+</button>
      <button class="btn-icon" id="btnDark">☾</button>
      <button class="btn-icon" id="btnToc">☰</button>
    </div>
  </div>

  <!-- BOOK STAGE -->
  <div class="book-stage">
    <div class="book" id="book">
      <!-- SPINE -->
      <div class="spine"><span class="spine-text">미디어와 공론장 · 하늘바다 · 클로드</span></div>

      <!-- PAGES WRAP -->
      <div class="pages-wrap" id="pagesWrap">

        <!-- MOBILE: SINGLE PAGE -->
        <div class="page-single" id="pageSingle"></div>

        <!-- DESKTOP: TWO-PAGE SPREAD -->
        <div class="spread" id="spread">
          <div class="page-left"><div class="page-inner" id="leftInner"></div></div>
          <div class="crease"></div>
          <div class="page-right"><div class="page-inner" id="rightInner"></div></div>
          <!-- FLIP PANEL -->
          <div class="flip-panel" id="flipPanel">
            <div class="flip-front" id="flipFront"></div>
            <div class="flip-back" id="flipBack"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottomnav">
    <button class="nav-btn" id="btnPrev" disabled>‹ 이전</button>
    <span class="page-indicator" id="pageIndicator"></span>
    <button class="nav-btn" id="btnNext">다음 ›</button>
  </div>

</div>

<!-- TOC OVERLAY -->
<div class="toc-overlay" id="tocOverlay" onclick="closeToc()">
  <div class="toc-panel" onclick="event.stopPropagation()">
    <div class="toc-hdr">
      <span class="toc-hdr-title">목차</span>
      <button class="btn-icon" onclick="closeToc()">✕</button>
    </div>
    <ul class="toc-list" id="tocList"></ul>
  </div>
</div>

<script>
// ── CONTENT DATA ──
const PAGES = [
  // 0: cover
  { id: 'cover', html: `
    <div class="cover">
      <div class="cover-ornament">❦</div>
      <div class="cover-subtitle">대담</div>
      <h1 class="cover-title">미디어와<br>공론장</h1>
      <div class="cover-rule"></div>
      <div class="cover-authors"><strong>하늘바다</strong> &nbsp;·&nbsp; <strong>클로드</strong></div>
      <p class="cover-desc">유튜브의 시대는 공자와 소크라테스의 말이 돌아온 것인가, 아니면 전혀 새로운 무언가인가.</p>
      <button class="cover-start" data-goto="1">읽기 시작하기 →</button>
    </div>` },

  // 1: toc
  { id: 'toc', html: `
    <div class="toc-content">
      <div class="toc-title">목차</div>
      <ul class="toc-list">
        <li class="toc-item" data-goto="2"><span class="toc-num">1</span><span class="toc-name">구술성의 귀환인가</span></li>
        <li class="toc-item" data-goto="4"><span class="toc-num">2</span><span class="toc-name">미디어의 영향력</span></li>
        <li class="toc-item" data-goto="6"><span class="toc-num">3</span><span class="toc-name">분절된 광장들</span></li>
        <li class="toc-item" data-goto="8"><span class="toc-num">4</span><span class="toc-name">필터버블이란 무엇인가</span></li>
        <li class="toc-item" data-goto="10"><span class="toc-num">5</span><span class="toc-name">공론장의 파편화</span></li>
        <li class="toc-item" data-goto="12"><span class="toc-num">6</span><span class="toc-name">조선 주막, 백성의 광장</span></li>
        <li class="toc-item" data-goto="14"><span class="toc-num">7</span><span class="toc-name">서원·향교, 엘리트의 광장</span></li>
      </ul>
    </div>` },

  // 2~4: ch1
  { id: 'ch1-open', html: `
    <div class="chap-header"><div class="chap-num">제 1 장</div><h2 class="chap-title">구술성의 귀환인가</h2></div>
    <div class="chap-intro" style="margin-bottom:24px">
      <p class="speech" style="font-size:13px;font-weight:300;line-height:1.9;color:var(--ink-light);font-style:italic">본격적인 텍스트 시대 이전, 공자·석가·소크라테스는 말로 사유를 전달했다. 유튜브의 등장은 그 시대의 귀환인가?</p>
    </div>
    <div class="dialogue">
      <div class="turn sky-turn">
        <div class="speaker-col"><span class="speaker-avatar">🙂</span><span class="speaker-name sky">하늘바다</span><span class="speaker-note">(이하 '바다')</span></div>
        <div class="speech-col"><div class="speech"><p>생각해보면 본격적인 텍스트 시대 이전에 공자, 석가, 소크라테스 같은 사람들은 말로 자신의 생각을 전달하는 사람들이었잖아. 어쩌면 책이나 신문 위주의 텍스트 시대에서 이제 유튜브 시대가 열린 것은 다시 말의 시대가 돌아온 거라고 볼 수 있지 않을까?</p></div></div>
      </div>
    </div>` },

  { id: 'ch1-a', html: `
    <div class="chap-num" style="margin-bottom:16px">제 1 장 · 구술성의 귀환인가</div>
    <div class="dialogue">
      <div class="turn claude-turn">
        <div class="speaker-col"><span class="speaker-avatar">🤖</span><span class="speaker-name claude">클로드</span></div>
        <div class="speech-col"><div class="speech">
          <p>흥미로운 관점인데, 부분적으로는 맞고 부분적으로는 다른 것 같아요.</p>
          <p><strong>맞는 부분 — 구술성의 귀환이라는 측면에서요.</strong><br>미디어 이론가 마샬 맥루한이나 월터 옹(Walter Ong)은 이미 이걸 예견했어요. 옹은 전자 미디어가 "제2의 구술성(secondary orality)"을 만든다고 했는데, 유튜브는 그 정점에 가깝죠.</p>
          <p><strong>다른 부분 — 결정적인 차이가 있어요.</strong><br>공자·소크라테스의 말은 쌍방향 대화였어요. 제자가 반박하고, 스승이 수정하고, 함께 생각이 다듬어졌죠. 유튜브의 말은 단방향 퍼포먼스에 가깝습니다.</p>
          <p><strong>또 다른 차이 — 몸과의 관계예요.</strong><br>고대의 구술은 같은 공간에서 이루어졌어요. 유튜브의 말은 몸이 분리된 채 편집되고 알고리즘으로 유통돼요. 유튜브 시대는 <em>말의 형식을 빌린 새로운 무언가</em>에 가까운 것 같아요.</p>
        </div></div>
      </div>
    </div>` },

  // 5~7: ch2
  { id: 'ch2-open', html: `

const TOC_LABELS = [['표지',0],['목차',1],['구술성의 귀환인가',2],['미디어의 영향력',4],['분절된 광장들',6],['필터버블이란 무엇인가',8],['공론장의 파편화',10],['조선 주막, 백성의 광장',12],['서원·향교, 엘리트의 광장',14]];

let current = 0;
let isAnimating = false;
let fontLevel = 0;

// ── RENDER ──
function isDesktop() { return window.innerWidth >= 700; }

function setContent(el, idx) {
  if (idx < 0 || idx >= TOTAL) { el.innerHTML = ''; return; }
  el.innerHTML = PAGES[idx].html;
  el.scrollTop = 0;
}

function renderMobile(idx) {
  const el = document.getElementById('pageSingle');
  setContent(el, idx);
}

function renderDesktop(leftIdx, rightIdx) {
  setContent(document.getElementById('leftInner'), leftIdx);
  setContent(document.getElementById('rightInner'), rightIdx);
}

function isSinglePage(idx) { return idx === 0 || idx === 1; }

function render(idx) {
  if (isDesktop()) {
    if (isSinglePage(idx)) {
      setContent(document.getElementById('leftInner'), idx);
      document.getElementById('rightInner').innerHTML = '';
    } else {
      const off = idx - 2;
      const left = off % 2 === 0 ? idx : idx - 1;
      renderDesktop(left, left + 1);
    }
  } else {
    renderMobile(idx);
  }
  updateNav();
}

function updateNav() {
  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = isDesktop() ? current + 1 >= TOTAL : current >= TOTAL - 1;
  const total = isDesktop() ? Math.ceil(TOTAL / 2) : TOTAL;
  const cur = isDesktop() ? Math.floor(current / 2) + 1 : current + 1;
  document.getElementById('pageIndicator').textContent = `${cur} / ${total}`;
}

// ── PAGE FLIP ANIMATION (desktop) ──
function flipForward(fromLeft, fromRight, toLeft, toRight) {
  if (isAnimating) return;
  isAnimating = true;

  const flipPanel = document.getElementById('flipPanel');
  const flipFront = document.getElementById('flipFront');
  const flipBack  = document.getElementById('flipBack');

  // front = current right page, back = next left page
  setContent(flipFront, fromRight);
  setContent(flipBack,  toLeft);
  flipPanel.style.display = 'block';
  flipPanel.classList.remove('flipping-back');
  flipPanel.classList.add('flipping-forward');

  setTimeout(() => {
    flipPanel.classList.remove('flipping-forward');
    flipPanel.style.display = 'none';
    renderDesktop(toLeft, toRight);
    isAnimating = false;
  }, 620);
}

function flipBackward(fromLeft, fromRight, toLeft, toRight) {
  if (isAnimating) return;
  isAnimating = true;

  const flipPanel = document.getElementById('flipPanel');
  const flipFront = document.getElementById('flipFront');
  const flipBack  = document.getElementById('flipBack');

  // back = current left page, front = previous right page
  setContent(flipBack,  fromLeft);
  setContent(flipFront, toRight);
  flipPanel.style.transform = 'rotateY(-180deg)';
  flipPanel.style.display = 'block';

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      flipPanel.classList.remove('flipping-forward');
      flipPanel.classList.add('flipping-back');
    });
  });

  setTimeout(() => {
    flipPanel.classList.remove('flipping-back');
    flipPanel.style.display = 'none';
    flipPanel.style.transform = '';
    renderDesktop(toLeft, toRight);
    isAnimating = false;
  }, 620);
}

// ── NAVIGATION ──
function goTo(idx, skipAnim) {
  if (idx < 0 || idx >= TOTAL) return;
  if (isAnimating) return;

  const prev = current;
  current = idx;

  if (!isDesktop() || skipAnim) {
    render(current);
    return;
  }

  // desktop flip
  const getLeft = (i) => {
    if (i === 0 || i === 1) return i;
    const off = i - 2;
    return off % 2 === 0 ? i : i - 1;
  };
  const prevLeft = getLeft(prev);
  const curLeft  = getLeft(current);

  // 단독 페이지(표지/목차)가 포함된 이동은 flip 없이 바로 렌더
  if (isSinglePage(prev) || isSinglePage(current)) {
    render(current);
    updateNav();
    return;
  }

  if (curLeft > prevLeft) {
    flipForward(prevLeft, prevLeft + 1, curLeft, curLeft + 1);
  } else if (curLeft < prevLeft) {
    flipBackward(prevLeft, prevLeft + 1, curLeft, curLeft + 1);
  } else {
    render(current);
  }
  updateNav();
}

function changePage(dir) {
  if (isAnimating) return;
  if (isDesktop()) {
    const step = (isSinglePage(current) || isSinglePage(current + dir)) ? 1 : 2;
    goTo(current + dir * step);
  } else {
    goTo(current + dir);
  }
}

// ── INIT ──
render(0);

// TOC
const tocList = document.getElementById('tocList');
TOC_LABELS.forEach(([label, pageIdx], i) => {
  const li = document.createElement('li');
  li.className = 'toc-item';
  li.innerHTML = `<span class="toc-num">${i < 2 ? '—' : i - 1}</span><span class="toc-name">${label}</span>`;
  li.onclick = () => { closeToc(); goTo(pageIdx); };
  tocList.appendChild(li);
});

// NAV BUTTONS
document.getElementById('btnPrev').onclick = () => changePage(-1);
document.getElementById('btnNext').onclick = () => changePage(1);

// KEYBOARD
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changePage(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   changePage(-1);
  if (e.key === 't' || e.key === 'T') toggleToc();
});

// TOUCH SWIPE
let tx = 0;
document.getElementById('pagesWrap').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.getElementById('pagesWrap').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) changePage(dx < 0 ? 1 : -1);
}, {passive:true});

// FONT SIZE
document.getElementById('btnFontDown').onclick = () => {
  const b = document.body;
  b.classList.remove('font-sm','font-lg');
  if (fontLevel > -1) fontLevel--;
  if (fontLevel === -1) b.classList.add('font-sm');
};
document.getElementById('btnFontUp').onclick = () => {
  const b = document.body;
  b.classList.remove('font-sm','font-lg');
  if (fontLevel < 1) fontLevel++;
  if (fontLevel === 1) b.classList.add('font-lg');
};

// DARK MODE
document.getElementById('btnDark').onclick = () => {
  document.body.classList.toggle('dark');
  document.getElementById('btnDark').textContent = document.body.classList.contains('dark') ? '☀' : '☾';
};

// TOC
document.getElementById('btnToc').onclick = toggleToc;
function toggleToc() { document.getElementById('tocOverlay').classList.toggle('open'); }
function closeToc() { document.getElementById('tocOverlay').classList.remove('open'); }

// RESIZE
window.addEventListener('resize', () => { render(current); });

// EVENT DELEGATION — handles dynamically injected onclick targets
document.getElementById('pagesWrap').addEventListener('click', e => {
  const el = e.target.closest('[data-goto]');
  if (el) goTo(parseInt(el.dataset.goto));
});
</script>
</body>
</html>
